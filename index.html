\n\n  async function cfg() {\n    const r = new Response(window.__CFG);\n    if (!r.ok) throw err('config.json tidak ditemukan di folder public.', 404);\n    return r.json();\n  }\n\n  async function local(path, method, body) {\n    const me = localStorage.getItem(K.s);\n    const need = () => { const u = me && rd(K.u, {})[me]; if (!u) throw err('Silakan login dulu.', 401); return me; };\n\n    if (path === 'register' || path === 'login') {\n      const u = String(body.username || '').trim().toLowerCase(), p = String(body.password || '');\n      const users = rd(K.u, {});\n      if (path === 'register') {\n        if (!/^[a-z0-9_]{3,16}$/.test(u)) throw err('Username 3-16 karakter: huruf, angka, underscore.', 400);\n        if (p.length < 6) throw err('Password minimal 6 karakter.', 400);\n        if (users[u]) throw err('Username sudah dipakai.', 409);\n        const salt = rnd(); users[u] = { salt, pw: await hash(p, salt), createdAt: new Date().toISOString() }; wr(K.u, users);\n      } else {\n        const x = users[u];\n        if (!x || x.pw !== await hash(p, x.salt)) throw err('Username atau password salah.', 401);\n      }\n      localStorage.setItem(K.s, u); return { ok: true, username: u };\n    }\n    if (path === 'logout') { localStorage.removeItem(K.s); return { ok: true }; }\n    if (path === 'me') { const n = need(); const x = rd(K.u, {})[n]; return { username: n, avatar: x.avatar || 'p0', createdAt: x.createdAt }; }\n    if (path === 'profile') {\n      const n = need(), av = body.avatar;\n      if (!(typeof av === 'string' && (/^p[0-7]$/.test(av) || (av.length < 70000 && /^data:image\\/(jpeg|png|webp);base64,/.test(av))))) throw err('Foto profil tidak valid.', 400);\n      const users = rd(K.u, {}); users[n].avatar = av; wr(K.u, users); return { ok: true, avatar: av };\n    }\n    if (path === 'stories' || path.startsWith('stories/')) {\n      const n = need(), users = rd(K.u, {});\n      const live = rd(K.st, []).filter(s => Date.now() - new Date(s.createdAt).getTime() < 864e5);\n      if (method === 'GET') { const avatars = {}; live.forEach(s => { avatars[s.user] = (users[s.user] && users[s.user].avatar) || 'p0'; }); return { stories: live, avatars }; }\n      if (method === 'DELETE') {\n        const id = path.split('/')[1], s = live.find(x => x.id === id);\n        if (!s || s.user !== n) throw err('Status tidak ditemukan.', 404);\n        wr(K.st, live.filter(x => x.id !== id)); return { ok: true };\n      }\n      const BGS = ['#3b82f6', '#ef4444', '#22c55e', '#a855f7', '#f59e0b', '#0ea5e9', '#ec4899', '#111827'];\n      const text = String(body.text || '').trim().slice(0, 200);\n      if (!text) throw err('Tulis dulu isi statusnya.', 400);\n      if (live.filter(s => s.user === n).length >= 5) throw err('Maksimal 5 status aktif. Hapus salah satu dulu.', 400);\n      const story = { id: 'S' + Date.now().toString(36) + rnd().slice(0, 4), user: n, text, bg: BGS.includes(body.bg) ? body.bg : BGS[0], createdAt: new Date().toISOString() };\n      live.push(story); wr(K.st, live); return { ok: true, story };\n    }\n    if (path === 'config') { need(); return cfg(); }\n    if (path === 'orders') {\n      const u = need(), all = rd(K.o, []);\n      if (method === 'GET') return all.filter(o => o.user === u).reverse();\n      const p = (await cfg()).products.find(x => x.id === body.productId);\n      if (!p) throw err('Produk tidak ditemukan.', 400);\n      const qty = p.unit ? Math.min(100, Math.max(1, parseInt(body.qty, 10) || 1)) : 1;\n      const o = { id: 'PX' + Date.now().toString(36).toUpperCase(), user: u, productId: p.id, product: p.unit ? `${p.name} (${qty} ${p.unit})` : p.name, price: p.price * qty, priceMax: p.priceMax || undefined, qty,\n        note: String(body.note || '').slice(0, 200), via: body.via === 'telegram' ? 'telegram' : 'whatsapp',\n        status: 'menunggu', createdAt: new Date().toISOString() };\n      all.push(o); wr(K.o, all); return { ok: true, order: o };\n    }\n    throw err('Endpoint tidak dikenal.', 404);\n  }\n\n  async function call(url, opts = {}) {\n    const method = (opts.method || 'GET').toUpperCase();\n    const body = opts.body ? JSON.parse(opts.body) : {};\n    const path = url.replace(/^\\/?api\\//, '');\n    if (await detect() === 'local') return local(path, method, body);\n    const r = await fetch('api/' + path, {\n      method, credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },\n      body: method === 'GET' ? undefined : JSON.stringify(body)\n    });\n    let d = {}; try { d = await r.json(); } catch {}\n    if (!r.ok) throw err(d.error || 'Gagal.', r.status);\n    return d;\n  }\n\n  window.PS = { call, ready: detect };\n})();\n<\/script>\n<script>\nlet mode='login';\nconst $=id=>document.getElementById(id);\nfunction setMode(m){\n  mode=m;\n  $('tLogin').classList.toggle('on',m==='login');\n  $('tReg').classList.toggle('on',m==='register');\n  $('go').textContent=m==='login'?'Masuk':'Buat akun';\n  $('p').autocomplete=m==='login'?'current-password':'new-password';\n  $('msg').textContent='';\n}\n$('tLogin').onclick=()=>setMode('login');\n$('tReg').onclick=()=>setMode('register');\n$('f').onsubmit=async e=>{\n  e.preventDefault();\n  $('msg').textContent='';\n  try{\n    await PS.call('/api/'+mode,{method:'POST',body:JSON.stringify({username:$('u').value,password:$('p').value})});\n    parent.nav('dashboard');\n  }catch(err){$('msg').textContent=err.message}\n};\nPS.ready().then(m=>{if(m==='local')$('mode').textContent='Mode lokal: akun tersimpan di browser ini'});\nPS.call('/api/me').then(()=>{parent.nav('dashboard')}).catch(()=>{});\n<\/script>\n<\/body>\n<\/html>\n", "dashboard": "<!doctype html>\n<html lang=\"id\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<meta name=\"theme-color\" content=\"#ffffff\">\n<meta name=\"color-scheme\" content=\"light\">\n<title>Pixel Shop - Dashboard<\/title>\n<link href=\"https://fonts.googleapis. \\": 10000\\n    },\\n    {\\n      \\\"id\\\": \\\"am-1y\\\",\\n      \\\"cat\\\": \\\"am\\\",\\n      \\\"name\\\": \\\"AM Premium 1 Tahun\\\",\\n      \\\"desc\\\": \\\"Akun Alight Motion Premium 365 hari\\\",\\n      \\\"price\\\": 2000,\\n      \\\"priceMax\\\": 4000\\n    }\\n  ],\\n  \\\"ad\\\": {\\n    \\\"enabled\\\": true,\\n    \\\"title\\\": \\\"SILVIA S15 \\u00b7 CHILL DRIVE\\\",\\n    \\\"src\\\": \\\"pixel:silvia\\\",\\n    \\\"link\\\": \\\"\\\",\\n    \\\"linkText\\\": \\\"Lihat promo\\\",\\n    \\\"ratio\\\": \\\"16/9\\\"\\n  },\\n  \\\"tgUsername\\\": \\\"username_admin\\\",\\n  \\\"stats\\\": [\\n    {\\n      \\\"label\\\": \\\"Pelanggan\\\",\\n      \\\"value\\\": \\\"100+\\\"\\n    },\\n    {\\n      \\\"label\\\": \\\"Berdiri\\\",\\n      \\\"value\\\": \\\"2026\\\"\\n    },\\n    {\\n      \\\"label\\\": \\\"Rating\\\",\\n      \\\"value\\\": \\\"4.9\\\"\\n    }\\n  ]\\n}\";/* Penghubung data: pakai server Node kalau ada (npm start),\n   kalau tidak ada (mis. preview Acode / hosting statis) otomatis pakai localStorage. */\n(function () {\n  const K = { u: 'ps_users', o: 'ps_orders', s: 'ps_session', st: 'ps_stories' };\n  const rd = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch { return d; } };\n  const wr = (k, v) => localStorage.setItem(k, JSON.stringify(v));\n  const err = (m, s) => { const e = new Error(m); e.status = s; return e; };\n  const rnd = () => Math.random().toString(36).slice(2, 10);\n  let mode = null;\n\n  async function detect() {\n    if (mode) return mode;\n    try {\n      const r = await fetch('api/me', { credentials: 'same-origin' });\n      mode = (r.headers.get('content-type') || '').includes('json') ? 'server' : 'local';\n    } catch { mode = 'local'; }\n    return mode;\n  }\n\n  async function hash(pw, salt) {\n    const s = salt + ':' + pw;\n    if (window.crypto && crypto.subtle) {\n      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));\n      return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');\n    }\n    let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;\n    return 'x' + (h >>> 0).toString(16);\n  }\n\n  async function cfg() {\n    const r = new Response(window.__CFG);\n    if (!r.ok) throw err('config.json tidak ditemukan di folder public.', 404);\n    return r.json();\n  }\n\n  async function local(path, method, body) {\n    const me = localStorage.getItem(K.s);\n    const need = () => { const u = me && rd(K.u, {})[me]; if (!u) throw err('Silakan login dulu.', 401); return me; };\n\n    if (path === 'register' || path === 'login') {\n      const u = String(body.username || '').trim().toLowerCase(), p = String(body.password || '');\n      const users = rd(K.u, {});\n      if (path === 'register') {\n        if (!/^[a-z0-9_]{3,16}$/.test(u)) throw err('Username 3-16 karakter: huruf, angka, underscore.', 400);\n        if (p.length < 6) throw err('Password minimal 6 karakter.', 400);\n        if (users[u]) throw err('Username sudah dipakai.', 409);\n        const salt = rnd(); users[u] = { salt, pw: await hash(p, salt), createdAt: new Date().toISOString() }; wr(K.u, users);\n      } else {\n        const x = users[u];\n        if (!x || x.pw !== await hash(p, x.salt)) throw err('Username atau password salah.', 401);\n      }\n      localStorage.setItem(K.s, u); return { ok: true, username: u };\n    }\n    if (path === 'logout') { localStorage.removeItem(K.s); return { ok: true }; }\n    if (path === 'me') { const n = need(); const x = rd(K.u, {})[n]; return { username: n, avatar: x.avatar || 'p0', createdAt: x.createdAt }; }\n    if (path === 'profile') {\n      const n = need(), av = body.avatar;\n      if (!(typeof av === 'string' && (/^p[0-7]$/.test(av) || (av.length < 70000 && /^data:image\\/(jpeg|png|webp);base64,/.test(av))))) throw err('Foto profil tidak valid.', 400);\n      const users = rd(K.u, {}); users[n].avatar = av; wr(K.u '#1e3a8a'},{h:'#e5e7eb',s:'#e0a878',k:'#111',b:'#8b5cf6',p:'#4c1d95'}];\nconst BGS=['#3b82f6','#ef4444','#22c55e','#a855f7','#f59e0b','#0ea5e9','#ec4899','#111827'];\nfunction sprite(pal,px,rows){\n  const SPR_=rows||SPR;let s='';SPR_.forEach((r,y)=>{for(let x=0;x<r.length;x++){const c=r[x];if(c!=='.')s+=`<rect x=\"${x}\" y=\"${y}\" width=\"1\" height=\"1\" fill=\"${pal[c]}\"/>`}});\n  return `<svg viewBox=\"0 0 10 ${SPR_.length}\" width=\"${px*10}\" height=\"${px*SPR_.length}\" shape-rendering=\"crispEdges\" aria-hidden=\"true\">${s}<\/svg>`;\n}\nlet ME={username:'',avatar:'p0'},stories=[],avatars={};\nlet cfg,tab='home',cat='all',picked=null;\n\nasync function api(u,o){\n  try{return await PS.call(u,o)}\n  catch(e){if(e.status===401){parent.nav('index')}throw e}\n}\nfunction ytId(u){const m=String(u).match(/(?:youtu\\.be\\/|youtube\\.com\\/(?:watch\\?v=|embed\\/|shorts\\/))([\\w-]{11})/);return m&&m[1]}\n\nfunction drawAd(){\n  const a=cfg.ad, box=adEl;\n  if(!a||!a.enabled){box.hidden=true;return}\n  const y=ytId(a.src);\n  const isPx=String(a.src).startsWith('pixel:');\n  const media=isPx\n    ?`<canvas class=\"pxscene\" width=\"192\" height=\"108\" role=\"img\" aria-label=\"Animasi pixel mobil Silvia S15 modif hitam santai di malam hari\"><\/canvas>`\n    :y\n    ?`<iframe src=\"https://www.youtube.com/embed/${y}?autoplay=1&mute=1&loop=1&playlist=${y}&playsinline=1&controls=0&disablekb=1&rel=0&modestbranding=1\" title=\"Iklan video\" allow=\"autoplay; encrypted-media\" tabindex=\"-1\"><\/iframe>`\n    :`<video src=\"${esc(a.src)}\" autoplay muted loop playsinline preload=\"auto\" tabindex=\"-1\" disablepictureinpicture disableremoteplayback controlslist=\"nodownload noplaybackrate nofullscreen\"><\/video><span>Taruh video iklan di public/ads/iklan.mp4<\/span>`;\n  const link=a.link?`<div class=\"adfoot\"><a class=\"btn gold\" href=\"${esc(a.link)}\" target=\"_blank\" rel=\"noopener\">${esc(a.linkText||'Lihat promo')}<\/a><\/div>`:'';\n  const r=(a.ratio||'16/9').replace('/',' / ');\n  box.innerHTML=`<div class=\"px\"><div class=\"adbox\" style=\"aspect-ratio:${esc(r)};${['9/16','1/1'].includes(a.ratio||'')?'max-width:360px;margin:0 auto':''}\">${media}<\/div>${link}<\/div>`;\n  box.hidden=false;\n  const cvs=box.querySelector('canvas.pxscene');if(cvs&&window.PixelScene)PixelScene.start(cvs);\n  const v=box.querySelector('video');\n  if(v){\n    const go=()=>{v.play().catch(()=>{})};\n    v.onloadeddata=()=>{const s=box.querySelector('.adbox span');if(s)s.remove();go()};\n    v.onpause=()=>{if(!v.ended)go()};\n    v.oncontextmenu=e=>e.preventDefault();\n    document.addEventListener('visibilitychange',()=>{if(!document.hidden)go()});\n    document.addEventListener('click',go);\n    document.addEventListener('touchstart',go,{passive:true});\n    go();\n  }\n}\n\nfunction openDrawer(o){\n  $('drawer').classList.toggle('open',o); $('scrim').hidden=!o;\n  $('burger').setAttribute('aria-expanded',String(o));\n}\n$('burger').onclick=()=>openDrawer(true);\n$('close').onclick=$('scrim').onclick=()=>openDrawer(false);\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape')openDrawer(false)});\n\nfunction drawMenu(){\n  $('menu').innerHTML=TABS.map(([k,l])=>`<button class=\"btn ${k===tab?'on':''}\" data-k=\"${k}\" type=\"button\">${l}<\/button>`).join('');\n  $('menu').querySelectorAll('button').forEach(b=>b.onclick=()=>{openDrawer(false);go(b.dataset.k)});\n}\n\nfunction drawNav(){\n  const nav=$('nav');\n  nav.innerHTML=TABS.map(([k,l])=>`<button class=\"nb ${k===tab?'on':''}\" data-k=\"${k}\" type=\"button\" aria-label=\"${l}\" ${k===tab?'aria-current=\"page\"':''}>${ICON[k]}<\/button>`).join('')\n   ;\n  nav.querySelectorAll('.nb').forEach(b=>b.onclick=()=>go(b.dataset.k));\n}\nfunction go(k){tab=k;drawMenu();drawNav();render();window.scrollTo(0,0)}\n\nfunction catRow(attr,active){\n  return `<div class=\"cats\">${CATS.map(([k,l])=>`<button class=\"px cat ${active===k?'on':''}\" ${attr}=\"${k}\" type=\"button\"><span class=\"ico ${k}\">${pix(k,24)}<\/span>${l}<\/button>`).join('')}<\/div>`;\n}\n\nfunction card(p){\n  const old=p.oldPrice&&p.oldPrice>p.price?p.oldPrice:0;\n  const off=old?Math.round((old-p.price)/old*100):0;\n  const label=(CATS.find(c=>c[0]===p.cat)||[,p.cat])[1];\n  const icon=p.icon?`<img src=\"${esc(p.icon)}\" alt=\"\" width=\"48\" height=\"48\">`:pix(p.cat,48);\n  const cover=(p.image?`<img class=\"bg\" src=\"${esc(p.image)}\" alt=\"\" loading=\"lazy\">`:'')+`<span class=\"iconcard\">${icon}<\/span>`;\n  return `<article class=\"px card\">\n    <div class=\"cover c-${esc(p.cat)}\">${cover}${p.tag?`<span class=\"tag\">${esc(p.tag)}<\/span>`:''}${off?`<span class=\"off\">-${off}%<\/span>`:''}<\/div>\n    <div class=\"body\">\n      <div><span class=\"chip\">${esc(label)}<\/span><\/div>\n      <h3>${esc(p.name)}<\/h3><p>${esc(p.desc)}<\/p>\n      ${(p.rating||p.sold)?`<div class=\"meta\">${p.rating?`<span>&#9733; ${esc(p.rating)}<\/span>`:''}${p.sold?`<span>${esc(p.sold)} terjual<\/span>`:''}<\/div>`:''}\n      ${old?`<div class=\"old\"><s>${rp(old)}<\/s><span class=\"save\">Hemat ${rp(old-p.price)}<\/span><\/div>`:''}\n      <div class=\"row\"><b class=\"price\">${priceText(p)}<\/b>${p.stock?`<span class=\"stock\">Sisa ${esc(p.stock)}<\/span>`:''}<\/div>\n      <button class=\"btn\" data-id=\"${esc(p.id)}\" type=\"button\">Beli Sekarang<\/button>\n    <\/div><\/article>`;\n}\n\nfunction contactLinks(text){\n  return {\n    wa:`https://wa.me/${cfg.waNumber}?text=${encodeURIComponent(text)}`,\n    tg:`https://t.me/${cfg.tgUsername}?text=${encodeURIComponent(text)}`\n  };\n}\n\nasync function render(){\n  const v=$('view');\n  if(tab!=='home')adEl.hidden=true;\n  const who=$('who').textContent;\n  if(tab==='home'){\n    const st=(cfg.stats||[]);\n    const l=contactLinks(`Halo admin, saya ${who}. Mau tanya sesuatu.`);\n    v.innerHTML=`<div class=\"px prof\">\n        <button class=\"ava\" id=\"avaBtn\" type=\"button\" aria-label=\"Ubah profil\">${avaHTML(ME.avatar,6)}<span class=\"avaedit\">${ICON.plus}<\/span><\/button>\n        <div><div class=\"pname\">${esc(who)}<\/div>\n          <div class=\"prow\"><span class=\"badge\">MEMBER<\/span><span class=\"pexp\">Akun aktif<\/span><\/div><\/div>\n        <div class=\"pfoot\"><div class=\"pst\">\n          <div>${ICON.grid}<span><b>${cfg.products.length}<\/b><small>Produk<\/small><\/span><\/div>\n          <div>${ICON.order}<span><b>${nOrders}<\/b><small>Order<\/small><\/span><\/div><\/div>\n          <span class=\"online\">ONLINE<\/span><\/div><\/div>\n      <div id=\"adslot\"><\/div>\n      <div class=\"px act\" id=\"stCard\">\n        <span class=\"actico cam\">${ICON.cam}<\/span>\n        <span>\n          <h3>Status &middot; Upload / Lihat<\/h3>\n          <p>Tap + upload &middot; <button class=\"stlink\" id=\"stView\" type=\"button\">${stories.length?`Tap teks lihat status (${stories.length})`:'Belum ada status'}<\/button><\/p><\/span>\n        <button class=\"plus\" id=\"stAdd\" type=\"button\" aria-label=\"Buat status\">${ICON.plus}<\/button><\/div>\n      ${stories.length?`<div class=\"sstrip\">${groups().map(g=>`<button class=\"sb\" data-u=\"${esc(g.user)}\" type=\"button\"><span class=\"ring ${g.items.every(s=>lsGet().includes(s.id))?'seen':''}\"><span class=\"rin\">${avaHTML(g.avatar,3)}<\/span><\/span><small>${esc(g.user===ME.username?'Status saya':g.user)}<\/small><\/button>`).join('')}<\/div>`:''}\n      <a class=\"px act\" href=\"${l.wa}\" target=\"_blank\" rel=\"noopener\">\n        <span class=\"actico\">${ICON.chat}<\/span>\n        <span>\n          <h3>Chat Admin<\/h3><p>Tap tombol + untuk chat WhatsApp<\/p><\/span>\n        <span class=\"plus\">${ICON.plus}<\/span><\/a>\n      <div class=\"px sstat\">\n        <div class=\"shead\"><span class=\"stitle\"><span class=\"sico\">${ICON.grid}<\/span>SHOP STATS<\/span><span class=\"active\">ACTIVE<\/span><\/div>\n        <div class=\"srow\"><span>TOKO BUKA<\/span><b>24 JAM<\/b><\/div>\n        <div class=\"bar2\"><i>
